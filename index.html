<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>HUD</title>
<style>
@font-face{font-family:M;font-weight:600;src:url(fonts/Montserrat-SemiBold.ttf)}
@font-face{font-family:M;font-weight:700;src:url(fonts/Montserrat-Bold.ttf)}
@font-face{font-family:M;font-weight:800;font-style:italic;src:url(fonts/Montserrat-ExtraBoldItalic.ttf)}
@font-face{font-family:M;font-weight:900;src:url(fonts/Montserrat-Black.ttf)}
@font-face{font-family:M;font-weight:900;font-style:italic;src:url(fonts/Montserrat-BlackItalic.ttf)}
@font-face{font-family:FA;font-weight:900;src:url(fonts/fa-solid-900.ttf)}
:root{--k:1}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none;pointer-events:none}
body{font-family:M,Arial,sans-serif;color:#fff}
.hidden{display:none!important}
.abs{position:absolute;line-height:1;white-space:nowrap}
.fa{font-family:FA;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}
.sh{text-shadow:0 1px 2px rgba(0,0,0,.45)}

/* ===== правый верхний HUD (координаты из макета 1920x1080, правый край = край экрана) ===== */
#hud{position:absolute;top:0;right:0;width:360px;height:240px;transform:scale(var(--k));transform-origin:top right}
#logo{left:16px;top:10px;width:89px;height:34px}
#title{right:35px;top:8.7px;font-size:21px;font-weight:900;color:#FA0D3E;letter-spacing:.1px}
#subtitle{right:35px;top:31.3px;font-size:11px;font-weight:600;color:#fff;letter-spacing:.2px}
.sep{position:absolute;left:16px;width:318px;height:1px;background:rgba(255,255,255,.18)}
#weap{left:17px;top:62px;width:78px;height:78px}
#weap img{width:100%;height:100%;display:block;filter:grayscale(1) brightness(1.08)}
#ammo{left:17px;width:78px;top:150px;text-align:center;font-style:italic;font-weight:800}
#ammo b{font-size:14px}#ammo span{font-size:10px;font-weight:800;margin-left:3px;opacity:.95}
.bar{position:absolute;left:107px;width:189px;height:8px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .35s}
.bar u{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:rgba(0,0,0,.2)}
#b-hp i{background:#F1133D}#b-eat i{background:#E67C00}#b-st i{background:#00AA60}
.val{right:26px;font-size:15px;font-weight:800;font-style:italic;text-align:right}
#money{left:16px;top:185.4px;font-size:48px;font-weight:900;font-style:italic;letter-spacing:2.2px;color:#67BB61}
#money .z{color:rgba(103,187,97,.32)}

/* ===== радар (левый нижний угол, координаты макета: верх блока = 680px) ===== */
#rad{position:absolute;left:0;bottom:0;width:480px;height:400px;transform:scale(var(--k));transform-origin:bottom left}
#frame{position:absolute;box-sizing:border-box;left:56px;top:82px;width:387px;height:218px;border:2px solid rgba(255,255,255,.95);border-radius:7px}
.ico{position:absolute;width:24px;height:24px;font-size:21px;color:#fff}
.txt{font-size:18.5px;font-weight:600;top:36.5px}
#t-clock{left:59px;top:33px}#time{left:91px}
#t-cal{left:192px;top:33px;font-size:22px}#date{left:224px}
.tog{position:absolute;top:28px;width:34px;height:34px;border-radius:6px;font-size:21px;color:rgba(255,255,255,.28);transition:all .2s}
.tog.on{background:rgba(0,0,0,.45);color:#fff}
#g-zone{left:371px}.tog svg{display:block}#g-mask{left:411px}
#t-loc{left:59px;top:325px;font-size:21px}
#loc{left:96px;top:328px;font-size:18px;font-weight:600}
</style>
</head>
<body>
<div id="hud">
  <svg id="logo" class="abs" viewBox="0 0 89 34" fill="#FA0D3E">
    <path d="M14 3c-2 2 2 3 0 5M17 2c-2 2 2 3 0 5" stroke="#FA0D3E" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M0 33 L30 8 L47 22 L61 10 L89 33 L80 33 L61 17 L51 26 L58 33 L49 33 L30 16 L9 33Z"/>
    <path d="M12 12h5v6l-5 4z"/>
    <rect x="25" y="24" width="5" height="5"/><rect x="58" y="24" width="5" height="5"/>
  </svg>
  <div id="title" class="abs sh">МАЛИНОВКА</div>
  <div id="subtitle" class="abs sh">ВТОРОЙ СЕРВЕР</div>
  <div class="sep" style="top:54px"></div>
  <div id="weap" class="abs"><img id="weap-img" src="img/weapons/0.png"></div>
  <div id="ammo" class="abs sh"></div>
  <div id="b-hp" class="bar" style="top:80px"><i></i><u></u></div>
  <div id="b-eat" class="bar" style="top:101px"><i></i><u></u></div>
  <div id="b-st" class="bar" style="top:122px"><i></i><u></u></div>
  <div id="v-hp" class="abs val sh" style="top:78.6px">100</div>
  <div id="v-eat" class="abs val sh" style="top:99.6px">100</div>
  <div id="v-st" class="abs val sh" style="top:120.6px">100</div>
  <div class="sep" style="top:173px"></div>
  <div id="money" class="abs sh"></div>
</div>

<div id="rad">
  <div id="frame"></div>
  <div id="t-clock" class="ico fa sh">&#xf017;</div><div id="time" class="abs txt sh">00:00:00</div>
  <div id="t-cal" class="ico fa sh">&#xf073;</div><div id="date" class="abs txt sh">01.01.2000</div>
  <div id="g-zone" class="tog fa" title="Зелёная зона">&#xf6ad;</div>
  <div id="g-mask" class="tog fa" title="Маска"><svg width="20" height="22" viewBox="0 0 20 22" fill="currentColor"><path fill-rule="evenodd" d="M10 0C4.5 0 1.5 4 1.5 9.5V18c0 2.2 3.8 4 8.5 4s8.5-1.8 8.5-4V9.5C18.5 4 15.5 0 10 0ZM3.8 8.2h12.4v4.3H3.8ZM7.5 15.5h5v2.6h-5Z"/><rect x="5.3" y="9.4" width="3.4" height="1.9" rx=".9" opacity=".0"/></svg></div>
  <div id="t-loc" class="ico fa sh">&#xf124;</div><div id="loc" class="abs sh"></div>
</div>

<script>
(function(){
  // ---------- настройки ----------
  var UTC_OFFSET_MIN = 180;      // время по Москве; null = время компьютера игрока
  var MONEY_DIGITS = 9;          // сколько цифр показывать (недостающие — тусклые нули)
  var CLIP = {22:17,23:17,24:7,25:1,26:2,27:7,28:50,29:30,30:30,31:50,32:50,33:1,34:1,35:1,36:1,37:500,38:500,41:500,42:500,43:36};

  var $ = function(id){return document.getElementById(id)};
  function fit(){ document.documentElement.style.setProperty('--k', (window.innerHeight/1080).toFixed(4)); }
  window.addEventListener('resize', fit); fit();

  function pad(n){return (n<10?'0':'')+n}
  function tick(){
    var d = new Date();
    if (UTC_OFFSET_MIN !== null) d = new Date(d.getTime() + (d.getTimezoneOffset() + UTC_OFFSET_MIN)*60000);
    $('time').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    $('date').textContent = pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
  }
  setInterval(tick, 250); tick();

  // полоска: до 100 — заполнение в %, больше 100 — полная + отметка на уровне 100
  function bar(id, v){
    v = Math.max(0, Math.round(+v||0));
    var b = $('b-'+id), i = b.firstChild, u = b.lastChild;
    i.style.width = Math.min(100, v) + '%';
    if (v > 100){ u.style.display='block'; u.style.left = (10000/v) + '%'; } else u.style.display='none';
    $('v-'+id).textContent = v;
  }
  function money(v){
    v = Math.floor(+v||0); var neg = v < 0, s = String(Math.abs(v)), z = '';
    while (z.length + s.length < MONEY_DIGITS) z += '0';
    $('money').innerHTML = (neg?'-':'') + '<span class="z">'+z+'</span>' + s + '₽';
  }
  function weapon(id, ammo){
    id = +id||0; ammo = +ammo||0;
    var img = $('weap-img'); img.onerror = function(){ this.onerror=null; this.src='img/weapons/0.png'; };
    img.src = 'img/weapons/'+id+'.png';
    var el = $('ammo');
    if (id <= 15 || id === 46 || ammo <= 0){ el.innerHTML = '<b>∞</b>'; return; }
    var c = CLIP[id] || ammo, inClip = ((ammo-1) % c) + 1, rest = ammo - inClip;
    el.innerHTML = '<b>'+inClip+'</b><span>'+rest+'</span>';
  }

  var api = {
    'hud:stats':    function(hp, eat, st){ bar('hp',hp); bar('eat',eat); bar('st',st); },
    'hud:money':    money,
    'hud:weapon':   weapon,
    'hud:location': function(name){ $('loc').textContent = name||''; $('t-loc').classList.toggle('hidden', !name); },
    'hud:icons':    function(zone, mask){ $('g-zone').classList.toggle('on', !!+zone); $('g-mask').classList.toggle('on', !!+mask); },
    'hud:server':   function(t, s){ $('title').textContent = t; $('subtitle').textContent = s; },
    'hud:show':     function(v){ document.body.classList.toggle('hidden', !+v); }
  };
  window.HUD = api;

  if (typeof cef !== 'undefined' && cef.on) {
    for (var k in api) (function(k){ cef.on(k, function(){ api[k].apply(null, arguments); }); })(k);
    if (cef.emit) cef.emit('hud:ready');
  } else {
    // предпросмотр в обычном браузере
    api['hud:stats'](171, 63, 320); money(3421917); weapon(24, 60);
    api['hud:location']('п. Заречный'); api['hud:icons'](0, 1);
  }
})();
</script>
</body>
</html>
